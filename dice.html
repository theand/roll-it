<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf3ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>주사위 던지기 · roll-it</title>
<style>
:root {
    color-scheme:light;
    --ink:#183f3a;
    --muted:#546e68;
    --paper:#edf3ed;
    --table:#18594f;
    --table-deep:#12493f;
    --accent:#ffc49d;
    --line:#cbd9d1;
    --white:#fffef7;
}
* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}
body {
    min-height:100dvh;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-tap-highlight-color:transparent;
}
button,a,summary {
    touch-action:manipulation;
}
button {
    font:inherit;
    cursor:pointer;
}
button:disabled {
    cursor:wait;
    opacity:.55;
}
button,a,summary {
    outline-offset:5px;
}
button:focus-visible,a:focus-visible,summary:focus-visible {
    outline:3px solid #bb4e27;
}
::selection {
    background:#ffc49d;
    color:#183f3a;
}
* {
    scrollbar-color:#73958b transparent;
    scrollbar-width:thin;
}
.container {
    width:min(1120px,100%);
    margin:auto;
    padding:24px 24px max(28px,env(safe-area-inset-bottom));
}
.site-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
    gap:20px;
}
.brand {
    font-size:28px;
    font-weight:850;
    letter-spacing:-.04em;
    text-decoration:none;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:9px;
}
.brand svg {
    width:28px;
    height:28px;
}
.brand-note {
    font-size:13px;
    color:var(--muted);
}
.mode-nav {
    display:flex;
    gap:4px;
    padding:5px;
    background:#dbe6df;
    border-radius:12px;
}
.mode-nav a {
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 20px;
    border-radius:8px;
    text-decoration:none;
    color:#385b52;
    font-size:14px;
    font-weight:650;
}
.mode-nav .nav-active {
    background:var(--ink);
    color:var(--white);
}
.mode-nav a:hover:not(.nav-active) {
    background:#ccdcd2;
}
.page-heading {
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:20px;
}
.page-heading h1 {
    font-size:30px;
    letter-spacing:-.035em;
    font-weight:800;
}
.page-heading p {
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
}
.workspace {
    display:grid;
    grid-template-columns:minmax(0,1fr) 280px;
    gap:32px;
    align-items:start;
}
.play-panel {
    min-width:0;
}
.play-field {
    position:relative;
    background:var(--table);
    border-radius:16px;
    min-height:470px;
    overflow:hidden;
    color:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 24px;
}
.play-field::after {
    content:'';
    position:absolute;
    inset:14px;
    border:1px solid #508477;
    border-radius:9px;
    pointer-events:none;
}
#result-area {
    position:relative;
    z-index:1;
    text-align:center;
    min-height:128px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
}
#result-name {
    font-size:64px;
    font-weight:800;
    line-height:1.08;
    letter-spacing:-.04em;
    color:var(--white);
}
#result-name.clr-ready {
    font-size:36px;
}
#result-desc {
    color:#d1e6db;
    font-size:15px;
    min-height:23px;
}
#result-extra {
    visibility:hidden;
    color:#183f3a;
    background:#ffc49d;
    border-radius:6px;
    padding:5px 12px;
    font-size:13px;
    font-weight:750;
    min-height:27px;
}
#result-extra.show {
    visibility:visible;
}
.clr-special,.clr-double {
    color:#ffd0a8!important;
}
.history-item .clr-special,.history-item .clr-double {
    color:#9b3e16!important;
}
.clr-back {
    color:#b4d9ff!important;
}
.history-item .clr-back {
    color:#285881!important;
}
#sticks-area,#dice-area {
    display:flex;
    flex:1;
    align-items:center;
    justify-content:center;
    gap:23px;
    width:100%;
    min-height:235px;
    padding:30px 0 24px;
    position:relative;
    z-index:1;
}
#sticks-area::after,#dice-area::after {
    content:'';
    position:absolute;
    bottom:30px;
    width:210px;
    height:24px;
    border-radius:50%;
    background:#0e3b32;
    filter:blur(12px);
    opacity:.6;
    z-index:-1;
}
.field-caption {
    color:#d1e6db;
    font-size:12px;
    position:relative;
    z-index:1;
    line-height:1.6;
    text-align:center;
}
.controls {
    padding-top:18px;
}
.control-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
}
.control-label,.dice-label {
    font-size:14px;
    font-weight:650;
}
.choice-group {
    display:flex;
    gap:5px;
    background:#dbe6df;
    padding:4px;
    border-radius:10px;
}
.toggle-btn,.count-btn,.sides-btn {
    min-width:44px;
    min-height:44px;
    padding:8px 13px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:var(--ink);
    font-size:14px;
    font-weight:650;
}
.toggle-btn.active,.count-btn.active,.sides-btn.active {
    background:var(--ink);
    color:var(--white);
}
#throw-btn,#roll-btn {
    min-height:60px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    border:0;
    border-radius:12px;
    background:var(--accent);
    color:#47301d;
    font-size:19px;
    font-weight:800;
    box-shadow:0 5px 12px #947b6340;
    transition:background .18s,transform .18s,box-shadow .18s;
}
#throw-btn:hover:not(:disabled),#roll-btn:hover:not(:disabled) {
    background:#ffd5b8;
}
#throw-btn:active:not(:disabled),#roll-btn:active:not(:disabled) {
    transform:translateY(4px);
    box-shadow:0 2px 5px #947b632e;
}
.action-arrow {
    font-size:24px;
    font-weight:400;
}
.keyboard-hint {
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin:15px 0 0;
}
#history-section {
    padding:4px 0;
    min-width:0;
}
.history-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
}
.history-header h2 {
    font-size:17px;
    font-weight:750;
}
.history-header span {
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    margin-left:6px;
}
#clear-btn {
    min-height:44px;
    padding:8px 0 8px 12px;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:13px;
}
#clear-btn:hover {
    color:#9b3e16;
}
#history-list {
    max-height:455px;
    overflow:auto;
}
.history-item {
    display:flex;
    align-items:center;
    gap:10px;
    min-height:62px;
    border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;
}
.hist-num {
    font-size:12px;
    color:var(--muted);
    min-width:22px;
}
.hist-name {
    font-size:19px;
    font-weight:800;
    min-width:40px;
}
.hist-desc {
    font-size:12px;
    color:var(--muted);
    flex:1;
}
.hist-sticks {
    display:flex;
    gap:3px;
}
.mini-stick {
    width:6px;
    height:22px;
    border-radius:3px;
}
.mini-flat {
    background:#d6ba7e;
}
.mini-round {
    background:#735331;
}
.history-empty {
    padding:42px 8px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.9;
}
.history-note {
    font-size:12px;
    color:var(--muted);
    margin-top:14px;
    line-height:1.7;
}
.hist-values {
    display:flex;
    gap:4px;
    align-items:center;
    flex-wrap:wrap;
}
.mini-die {
    display:grid;
    place-items:center;
    min-width:28px;
    height:28px;
    background:#dbe6df;
    border-radius:5px;
    color:var(--ink);
    font-weight:700;
    font-size:14px;
}
.hist-plus {
    font-size:12px;
    color:var(--muted);
}
.hist-sum {
    margin-left:auto;
    font-weight:800;
    font-size:18px;
}
.hist-kind {
    font-size:11px;
    color:var(--muted);
}
.rules {
    border-top:1px solid var(--line);
    margin-top:24px;
    padding-top:5px;
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
}
.rules summary {
    cursor:pointer;
    min-height:44px;
    padding:12px 0;
    color:var(--ink);
    font-weight:650;
}
.rules p {
    padding-bottom:12px;
}
.result-pop {
    animation:resultPop .35s cubic-bezier(.16,1,.3,1);
}
@keyframes resultPop {
    0% {
        transform:translateY(10px) scale(.92);
    }
    100% {
        transform:translateY(0) scale(1);
    }
}
@media(max-width:760px) {
    .container {
        padding:18px 18px max(28px,env(safe-area-inset-bottom));
    }
    .site-header {
        flex-wrap:wrap;
        gap:18px;
        margin-bottom:25px;
    }
    .brand {
        font-size:26px;
    }
    .brand-note {
        font-size:12px;
    }
    .mode-nav {
        order:3;
        width:100%;
    }
    .mode-nav a {
        flex:1;
        padding:0 8px;
    }
    .page-heading {
        align-items:flex-start;
        flex-direction:column;
        gap:5px;
        margin-bottom:18px;
    }
    .page-heading h1 {
        font-size:26px;
    }
    .page-heading p {
        font-size:13px;
    }
    .workspace {
        grid-template-columns:1fr;
        gap:30px;
    }
    .play-field {
        min-height:350px;
        padding:24px 18px 20px;
    }
    #result-area {
        min-height:110px;
    }
    #result-name {
        font-size:56px;
    }
    #sticks-area,#dice-area {
        min-height:175px;
        gap:18px;
        padding:24px 0 18px;
    }
    .controls {
        padding-top:16px;
    }
    .keyboard-hint {
        display:none;
    }
    #history-list {
        max-height:280px;
    }
    .history-empty {
        padding:25px 8px;
    }
    .history-note {
        margin-top:8px;
    }
}
@media(min-width:761px) and (max-width:950px) {
    .workspace {
        grid-template-columns:minmax(0,1fr) 245px;
        gap:24px;
    }
    .container {
        padding:24px;
    }
    .play-field {
        min-height:480px;
    }
    .mode-nav a {
        padding:0 14px;
    }
}
@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation-duration:.001ms!important;
        animation-delay:0ms!important;
        transition:none!important;
        scroll-behavior:auto!important;
    }
}
.die {
    width: 84px;
    height: 84px;
    background: white;
    border-radius: 14px;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
    transition: box-shadow 0.2s;
}
.die-cell {
    display: flex;
    align-items: center;
    justify-content: center;
}
.dot {
    width: 14px;
    height: 14px;
    background: #2C1810;
    border-radius: 50%;
}
.die.hidden {
    display: none;
}
@keyframes diceShake {
    0% {
        transform: translate(0, 0) rotate(0deg);
    }
    10% {
        transform: translate(-6px, -12px) rotate(-12deg);
    }
    20% {
        transform: translate(8px, -24px) rotate(10deg);
    }
    30% {
        transform: translate(-4px, -32px) rotate(-8deg);
    }
    40% {
        transform: translate(6px, -26px) rotate(14deg);
    }
    50% {
        transform: translate(-8px, -18px) rotate(-10deg);
    }
    60% {
        transform: translate(4px, -10px) rotate(6deg);
    }
    70% {
        transform: translate(-3px, -4px) rotate(-4deg);
    }
    80% {
        transform: translate(2px, -1px) rotate(2deg);
    }
    90% {
        transform: translate(-1px, 0) rotate(-1deg);
    }
    100% {
        transform: translate(0, 0) rotate(0deg);
    }
}
.die.shaking {
    animation: diceShake 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.die {
    width:100px;
    height:100px;
    border-radius:19px;
    background:#fffef4;
    padding:16px;
    box-shadow:0 7px 0 #c5d1bd,0 15px 20px #062f2966;
    rotate:-8deg;
}
.die:nth-child(2) {
    rotate:9deg;
    background:#ffe1ba;
}
.dot {
    background:#224c42;
    width:17px;
    height:17px;
}
@media(max-width:760px) {
    .die {
        width:85px;
        height:85px;
        padding:13px;
    }
    .dot {
        width:14px;
        height:14px;
    }
}
</style>

<div class="container">
<header class="site-header">
<a class="brand" href="index.html" aria-label="roll-it 홈">
<svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
<rect x="3" y="3" width="22" height="22" rx="6" stroke="currentColor" stroke-width="2" transform="rotate(-8 14 14)"/>
<circle cx="10" cy="10" r="2" fill="currentColor"/>
<circle cx="18" cy="18" r="2" fill="currentColor"/>
</svg>roll-it</a>
<span class="brand-note">가볍게 던져, 함께 즐겨.</span>
<nav class="mode-nav" aria-label="놀이 선택">

<a href="dice.html" class="nav-active" aria-current="page">주사위</a>

</nav>
</header>
<main>
<div class="page-heading">
<h1>주사위 던지기</h1>
<p>단순하게, 다음 한 칸을 결정해요.</p>
</div>
<div class="workspace">
<section class="play-panel" aria-label="주사위 던지기">
<div class="play-field">
<div id="result-area" aria-live="polite" aria-atomic="true">
<div id="result-name" class="clr-ready">준비됐나요?</div>
<div id="result-desc">버튼을 눌러 행운을 던져보세요</div>
<div id="result-extra">더블!</div>
</div>
<div id="dice-area">
<div class="die" id="die-0" role="img" aria-label="주사위 1">
</div>
<div class="die hidden" id="die-1" role="img" aria-label="주사위 1">
</div>
</div>
<p class="field-caption">눈의 합계를 한눈에 · 같은 숫자가 나오면 더블</p>
</div>
<div class="controls">
<div class="control-row">
<span class="control-label" id="count-label">주사위 개수</span>
<div class="choice-group" id="count-toggle" role="group" aria-labelledby="count-label">
<button type="button" class="toggle-btn active" data-count="1" aria-pressed="true">1개</button>
<button type="button" class="toggle-btn" data-count="2" aria-pressed="false">2개</button>
</div>
</div>
<button type="button" id="roll-btn">주사위 던지기 <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</button>
</div>
<p class="keyboard-hint">Space 또는 Enter 키로도 던질 수 있어요</p>
</section>
<aside id="history-section" aria-label="최근 던지기 기록">
<div class="history-header">
<h2>최근 기록 <span id="history-count">0회</span>
</h2>
<button type="button" id="clear-btn" style="visibility:hidden">기록 지우기</button>
</div>
<div id="history-list">
<div class="history-empty">첫 번째 행운을 기다리는 중.<br>한 번 던져볼까요?</div>
</div>
<p class="history-note">최근 30회 · 이 탭에서 모드를 바꿔도 유지돼요.</p>
<p id="storage-note" class="history-note" role="status">
</p>
</aside>
</div>

</div><script>
        var diceCount = 1;
        var rollCount = 0;
        var busy = false;
        var hist = [];

        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const STORAGE_KEY = 'roll-it:dice:v1';
        var ANIM_MS = 700;
        var CYCLE_MS = 60;

        var DOT_MAP = {
            1: [5],
            2: [3, 7],
            3: [3, 5, 7],
            4: [1, 3, 7, 9],
            5: [1, 3, 5, 7, 9],
            6: [1, 3, 4, 6, 7, 9]
        };

        var $ = function(id) { return document.getElementById(id); };
        var resultName = $('result-name');
        var resultDesc = $('result-desc');
        var resultExtra = $('result-extra');
        var rollBtn = $('roll-btn');
        var historyList = $('history-list');
        var clearBtn = $('clear-btn');
        var dieEls = [$('die-0'), $('die-1')];
        var toggleBtns = document.querySelectorAll('.toggle-btn');

        function mk(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = String(text);
            return e;
        }

        function renderDie(container, value) {
            container.textContent = '';
            container.setAttribute('aria-label', '주사위 ' + value);
            const positions = DOT_MAP[value] || [];
            for (let i = 1; i <= 9; i++) {
                const cell = mk('div', 'die-cell');
                if (positions.indexOf(i) !== -1) {
                    cell.appendChild(mk('div', 'dot'));
                }
                container.appendChild(cell);
            }
        }

        function randomFace() {
            return Math.floor(Math.random() * 6) + 1;
        }

        function initDice() {
            renderDie(dieEls[0], 1);
            renderDie(dieEls[1], 1);
        }

        function setDiceCount(n) {
            diceCount = n;
            toggleBtns.forEach(function(btn) {
                btn.classList.toggle('active', Number(btn.dataset.count) === n);
                btn.setAttribute('aria-pressed', String(Number(btn.dataset.count) === n));
            });
            dieEls[1].classList.toggle('hidden', n === 1);
            resultName.textContent = '준비';
            resultName.className = 'clr-ready';
            resultDesc.textContent = n + '개를 굴려볼까요?';
            resultExtra.classList.remove('show');
        }

        function doRoll() {
            if (busy) return;
            busy = true;
            rollBtn.disabled = true;
            rollBtn.textContent = '굴리는 중…';
            clearBtn.disabled = true;
            toggleBtns.forEach(btn => btn.disabled = true);
            $('result-area').setAttribute('aria-busy', 'true');

            const values = [];
            for (let i = 0; i < diceCount; i++) {
                values.push(randomFace());
            }
            rollCount++;

            resultName.textContent = '두근두근';
            resultName.className = '';
            resultDesc.textContent = '';
            resultExtra.classList.remove('show');

            // Start shake animation
            for (let i = 0; i < diceCount; i++) {
                dieEls[i].classList.remove('shaking');
                void dieEls[i].offsetHeight;
                dieEls[i].classList.add('shaking');
            }

            // Cycle random faces during animation
            var cycleTimer = setInterval(function() {
                for (let i = 0; i < diceCount; i++) {
                    renderDie(dieEls[i], randomFace());
                }
            }, CYCLE_MS);

            setTimeout(function() {
                clearInterval(cycleTimer);

                // Show final values
                for (let i = 0; i < diceCount; i++) {
                    renderDie(dieEls[i], values[i]);
                    dieEls[i].classList.remove('shaking');
                }

                var sum = values.reduce(function(a, b) { return a + b; }, 0);
                var isDouble = diceCount === 2 && values[0] === values[1];

                if (diceCount === 1) {
                    resultName.textContent = String(values[0]);
                    resultName.className = 'result-pop';
                    resultDesc.textContent = '';
                } else {
                    resultName.textContent = String(sum);
                    resultName.className = 'result-pop' + (isDouble ? ' clr-double' : '');
                    resultDesc.textContent = values[0] + ' + ' + values[1];
                    if (isDouble) resultExtra.classList.add('show');
                }

                if (navigator.vibrate) {
                    navigator.vibrate(isDouble ? [40, 20, 40] : 25);
                }

                pushHistory(values, sum, isDouble);

                busy = false;
                rollBtn.disabled = false;
                rollBtn.textContent = '다시 던지기';
                clearBtn.disabled = false;
                toggleBtns.forEach(btn => btn.disabled = false);
                $('result-area').setAttribute('aria-busy', 'false');
            }, reducedMotion.matches ? 30 : ANIM_MS);
        }

        function pushHistory(values, sum, isDouble) {
            hist.unshift({ values: values, sum: sum, isDouble: isDouble, num: rollCount });
            hist.splice(30);
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            historyList.textContent = '';
            $('history-count').textContent = hist.length + '회';

            if (!hist.length) {
                historyList.appendChild(mk('div', 'history-empty', '첫 번째 행운을 기다리는 중. 한 번 던져볼까요?'));
                clearBtn.style.visibility = 'hidden';
                return;
            }

            clearBtn.style.visibility = 'visible';

            hist.slice(0, 30).forEach(function(h) {
                var item = mk('div', 'history-item');

                item.appendChild(mk('span', 'hist-num', h.num));

                var valuesDiv = mk('div', 'hist-values');
                h.values.forEach(function(v, i) {
                    if (i > 0) valuesDiv.appendChild(mk('span', 'hist-plus', '+'));
                    valuesDiv.appendChild(mk('span', 'mini-die', v));
                });
                item.appendChild(valuesDiv);

                var sumCls = 'hist-sum' + (h.isDouble ? ' clr-double' : '');
                if (h.values.length > 1) {
                    item.appendChild(mk('span', sumCls, '= ' + h.sum));
                }

                historyList.appendChild(item);
            });
        }

        function clearAll() {
            hist.length = 0;
            rollCount = 0;
            saveHistory();
            renderHistory();
        }

        // Events
        rollBtn.addEventListener('click', doRoll);
        clearBtn.addEventListener('click', clearAll);

        toggleBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (!busy) setDiceCount(Number(btn.dataset.count));
            });
        });

        document.addEventListener('keydown', function(e) {
            if ((e.code === 'Space' || e.code === 'Enter') && document.activeElement === document.body) {
                e.preventDefault();
                doRoll();
            }
        });


        function saveHistory() {
            try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(hist)); }
            catch { $('storage-note').textContent = '이 브라우저에서는 이동 후 기록을 유지할 수 없어요.'; }
        }
        function readHistory() {
            try {
                const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '[]');
                return Array.isArray(saved) ? saved.slice(0, 30) : [];
            } catch { return []; }
        }

        for (const h of readHistory()) {
            if (h && Array.isArray(h.values) && [1,2].includes(h.values.length) && h.values.every(v => Number.isInteger(v) && v >= 1 && v <= 6) && Number.isSafeInteger(h.num) && h.num > 0) {
                hist.push({values:h.values, sum:h.values.reduce((a,b) => a+b,0), isDouble:h.values.length===2 && h.values[0]===h.values[1], num:h.num});
            }
        }
        rollCount = Math.max(0, ...hist.map(h => h.num));
        renderHistory();
        initDice();
    </script></body></html>
